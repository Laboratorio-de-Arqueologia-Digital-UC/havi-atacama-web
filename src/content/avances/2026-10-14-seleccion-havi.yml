titulo_es: HAVI Atacama, uno de los 19 proyectos seleccionados por Schmidt Sciences
titulo_en: HAVI Atacama among 19 projects selected by Schmidt Sciences
fecha: 2026-10-14
resumen_es: El proyecto fue seleccionado para el Humanities and AI Virtual Institute (HAVI) de Schmidt Sciences. Reúne a CENIA, la Universidad de Tarapacá, la Pontificia Universidad Católica de Chile y la Universidad de Chile.
resumen_en: The project was selected for Schmidt Sciences' Humanities and AI Virtual Institute (HAVI). It brings together CENIA, Universidad de Tarapacá, Pontificia Universidad Católica de Chile and Universidad de Chile.
cuerpo_es: |-
  El 14 de octubre de 2026 Schmidt Sciences anunció los proyectos seleccionados para su Humanities and AI Virtual Institute (HAVI). Motifs Across Media fue uno de los 19 elegidos en el mundo.

  Durante dos años, un equipo de arqueología e inteligencia artificial de cuatro instituciones chilenas estudiará los motivos que comparten la cerámica, los geoglifos y el arte rupestre de los valles de Lluta, Azapa y Camarones, entre los años 1000 y 1400.
cuerpo_en: |-
  On 14 October 2026 Schmidt Sciences announced the projects selected for its Humanities and AI Virtual Institute (HAVI). Motifs Across Media was one of 19 chosen worldwide.

  Over two years, an archaeology and artificial intelligence team from four Chilean institutions will study the motifs shared by the ceramics, geoglyphs and rock art of the Lluta, Azapa and Camarones valleys between AD 1000 and 1400.
