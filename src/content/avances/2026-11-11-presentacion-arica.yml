titulo_es: Presentación abierta del proyecto en Arica
titulo_en: Open presentation of the project in Arica
fecha: 2026-11-11
resumen_es: El miércoles 2 de diciembre de 2026, a las 16:20, el equipo presentará el proyecto en el Auditorio Ricardo Salas del Campus Saucache de la Universidad de Tarapacá.
resumen_en: On Wednesday 2 December 2026 at 16:20, the team will present the project at the Ricardo Salas Auditorium, Campus Saucache, Universidad de Tarapacá.
cuerpo_es: |-
  El 1 y 2 de diciembre el equipo completo se reúne por primera vez en Arica. La jornada termina con una presentación abierta a la comunidad universitaria y regional, con espacio para preguntas y una invitación a tesistas y estudiantes a sumarse.

  **Miércoles 2 de diciembre de 2026, 16:20.** Auditorio Ricardo Salas, Campus Saucache, Universidad de Tarapacá, Arica.
cuerpo_en: |-
  On 1 and 2 December the full team meets in Arica for the first time. The visit ends with a presentation open to the university and regional community, with time for questions and an invitation for students and thesis candidates to get involved.

  **Wednesday 2 December 2026, 16:20.** Ricardo Salas Auditorium, Campus Saucache, Universidad de Tarapacá, Arica.
