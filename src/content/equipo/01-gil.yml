bio_es: 'Francisca Gil es investigadora del Centro Nacional de Inteligencia Artificial (CENIA), donde lidera la investigación en métodos de IA multimodal para la preservación y el acceso al patrimonio cultural. También es profesora adjunta en la Pontificia Universidad Católica de Chile, donde dicta Tópicos Avanzados en Computación Gráfica. Se doctoró en la New York University con una investigación sobre optimización de formas para fabricación digital. Luego fue Senior Applied Scientist en Amazon, donde trabajó con fotógrafos y diseñadores para acelerar la creación de modelos 3D y llevó a producción investigación en reconstrucción 3D y Gaussian Splatting. En Amazon, a través de mentorías de investigación, publicó artículos con revisión de pares en ECCV e ICCV y coorganizó talleres en ambas conferencias. Hoy aplica su experiencia técnica e interdisciplinaria a preguntas de patrimonio cultural: investiga cómo las representaciones 3D y de aprendizaje automático pueden apoyar la interpretación experta del pasado.'
bio_en: Francisca Gil is a researcher at Centro Nacional de Inteligencia Artificial (CENIA), where she leads research on multimodal AI methods for cultural heritage preservation and access. She is also an Adjunct Professor at Pontificia Universidad Católica de Chile, where she teaches Advanced Topics in Computer Graphics. Francisca earned her Ph.D. at New York University, working on shape optimization for digital manufacturing. She continued as a Senior Applied Scientist at Amazon, working alongside photographers and designers to accelerate the creation of 3D models, bridging research in 3D reconstruction and Gaussian Splatting to production. While at Amazon, she produced peer-reviewed publications at ECCV and ICCV through research mentorship, and co-organized workshops at both conferences. She is now applying her technical depth and interdisciplinary experience to questions in cultural heritage, investigating how 3D and ML representations can support expert interpretation of the past.
