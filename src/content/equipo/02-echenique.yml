bio_es: Ester Echenique es profesora asistente del Departamento de Antropología de la Universidad de Tarapacá, Chile. Su investigación se centra en arqueología, cultura material y enfoques interdisciplinarios en ciencias sociales, con énfasis en estudios cerámicos, tecnología, movilidad e interacción social en los Andes Centro-Sur. Tiene amplia experiencia integrando métodos arqueométricos y análisis composicionales al estudio de tecnologías cerámicas antiguas, su producción y las conexiones interregionales, y colabora en proyectos que incorporan herramientas digitales y enfoques basados en datos. Su trabajo combina perspectivas científicas y sociales para explorar cómo las prácticas materiales moldean los procesos sociales a lo largo del tiempo. Ha dirigido y participado en numerosas iniciativas de investigación colaborativa, nacionales e internacionales, y ha aportado a discusiones sobre patrimonio cultural, investigación interdisciplinaria y el estudio de las sociedades antiguas.
bio_en: Ester Echenique is Assistant Professor in the Department of Anthropology at the University of Tarapacá, Chile. Her research focuses on archaeology, material culture, and interdisciplinary approaches to the social sciences, with particular emphasis on ceramic studies, technology, mobility, and social interaction in the South-Central Andes. She has extensive experience integrating archaeometric methods and compositional analyses into the study of ancient ceramic technologies, production, and interregional connections, while also collaborating on projects that incorporate digital tools and data-driven approaches to the study of the past. Her work combines scientific and social perspectives to explore how material practices shape social processes over time. She has led and participated in numerous national and international collaborative research initiatives, contributing to broader discussions on cultural heritage, interdisciplinary research, and the study of ancient societies.
