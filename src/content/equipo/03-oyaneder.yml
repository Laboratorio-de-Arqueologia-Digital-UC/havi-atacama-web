bio_es: Adrián Oyaneder es profesor asistente del Departamento de Antropología de la Universidad de Tarapacá, donde dirige el recién creado Laboratorio de Humanidades Digitales. Es arqueólogo chileno, con foco en estudios andinos, y tiene amplia experiencia de terreno e investigación en Chile, Argentina, Sri Lanka y el Reino Unido. Actualmente es investigador responsable de un proyecto financiado por ANID que estudia trampas prehispánicas de caza (chacu) en los Andes del norte de Chile, combinando percepción remota, geofísica, etnografía y etnohistoria. Su trabajo une la arqueología tradicional con aplicaciones computacionales, integrando geomática, geohumanidades y humanidades digitales para estudiar, preservar y custodiar el patrimonio cultural. Antes de su cargo actual fue Research Fellow en el Digital Humanities Lab de la Universidad de Exeter.
bio_en: Adrián Oyaneder is an Assistant Professor in the Anthropology Department at the Universidad de Tarapacá, where he directs the newly established Digital Humanities Lab. He is a Chilean archaeologist with a primary focus on Andean studies and has extensive field and research experience spanning Chile, Argentina, Sri Lanka, and the UK. Currently, he is the Principal Investigator of an ANID-funded project investigating pre-Hispanic chacu hunting traps in the northern Chilean Andes through a combination of remote sensing, geophysics, ethnography, and ethnohistory. His work bridges traditional archaeology and computer applications by integrating geomatics, Geohumanities, and Digital Humanities to study, preserve and steward cultural heritage. Prior to his current appointment, he served as a Research Fellow at the University of Exeter's Digital Humanities Lab.
