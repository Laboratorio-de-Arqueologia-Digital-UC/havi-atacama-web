bio_es: Daniela Valenzuela es profesora titular del Departamento de Antropología de la Universidad de Tarapacá, Chile, y profesora adjunta de posgrado en el programa de Antropología de la Trent University, Canadá. Su investigación aborda preguntas de gran escala sobre economías prehispánicas, relaciones entre humanos y animales y cultura visual en el desierto de Atacama y los Andes Centro-Sur. A partir del estudio del arte rupestre, ha ampliado su foco hacia problemas más amplios, como el papel de los animales en las sociedades prehistóricas y la dinámica de largo plazo de las relaciones entre humanos y camélidos, integrando diversas líneas de evidencia en equipos interdisciplinarios. Este enfoque colaborativo combina arqueología, zooarqueología, bioantropología, análisis de isótopos estables, etnografía y etnohistoria para avanzar en una comprensión interregional de la economía, la tecnología, la cultura material y las relaciones entre humanos y no humanos en contextos arqueológicos sudamericanos.
bio_en: Daniela Valenzuela is Full Professor in the Department of Anthropology at the Universidad de Tarapacá, Chile, and Adjunct Graduate Faculty in the Anthropology Graduate Program at Trent University, Canada. Her research addresses large-scale questions about pre-Hispanic economies, human–animal relations, and visual culture in the Atacama Desert and the South-Central Andes. Starting from rock art studies, she has progressively expanded her focus to tackle broader problems, such as the role of animals in prehistoric societies and the long-term dynamics of human–camelid relationships, by integrating diverse lines of evidence across interdisciplinary teams. This collaborative approach combines archaeology, zooarchaeology, bioanthropology, stable isotope analysis, ethnography, and ethnohistory to advance cross-regional understandings of economy, technology, material culture, and human–nonhuman relationships in South American archaeological contexts.
