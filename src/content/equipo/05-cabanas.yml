bio_es: Ana María Cabanas es profesora asociada del Departamento de Física y directora de Investigación de la Universidad de Tarapacá. Su trabajo vincula sistemas complejos, física médica e inteligencia artificial, con foco en una IA confiable y equitativa para la salud. Lidera investigación interdisciplinaria sobre sesgo y equidad en la oximetría de pulso, conjuntos de datos dermatológicos para aplicaciones de IA, análisis de afecto facial según tono de piel y sistemas de visión por computador para aplicaciones biomédicas y centradas en las personas. Física de formación, es doctora en Ciencias por la Universidad de Tarapacá y licenciada en Física por la Universidad Complutense de Madrid. Imparte cursos de pregrado, posgrado y formación profesional sobre física, aprendizaje automático, sistemas complejos y uso responsable de la IA en la academia y disciplinas afines.
bio_en: Ana María Cabanas is an Associate Professor in the Department of Physics and Director of Research at Universidad de Tarapacá. Her work connects complex systems, medical physics, and artificial intelligence, with a particular focus on trustworthy and equitable AI for health. She leads interdisciplinary research on bias and fairness in pulse oximetry, dermatological datasets for AI-based applications, facial affect analysis across skin tone, and computer vision systems for biomedical and human-centered applications. Trained as a physicist, she holds a Ph.D. in Science from Universidad de Tarapacá and a degree in Physics from Universidad Complutense de Madrid. She also teaches undergraduate, graduate, and professional-development courses on physics, machine learning, complex systems, and the responsible use of AI in academia and related disciplines.
