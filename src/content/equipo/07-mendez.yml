bio_es: Víctor Andrés Méndez Muñoz es profesor adjunto de la Escuela de Antropología y coordinador del Laboratorio de Arqueología Digital (LAD_UC) de la Pontificia Universidad Católica de Chile. Su investigación se centra en la documentación digital del patrimonio, el análisis espacial y los métodos computacionales aplicados a la arqueología, con énfasis en arte rupestre, movilidad de cazadores-recolectores y uso prehistórico del territorio en los Andes Centro-Sur. Integra fotogrametría, LiDAR terrestre y modelamiento con SIG al estudio de paisajes arqueológicos y cultura material, y desarrolla enfoques de aprendizaje automático para modelamiento predictivo. Su trabajo combina metodologías digitales con trabajo de terreno tradicional para estudiar el asentamiento humano en diversos ambientes andinos y costeros. Ha dirigido y participado en iniciativas de investigación nacionales e internacionales, y ha aportado a discusiones sobre patrimonio virtual, arqueología interdisciplinaria y la transformación digital de la práctica patrimonial.
bio_en: Víctor Andrés Méndez Muñoz is Adjunct Professor at the School of Anthropology and Coordinator of the Digital Archaeology Laboratory (LAD_UC) at the Pontificia Universidad Católica de Chile. His research focuses on digital heritage documentation, spatial analysis, and computational methods applied to archaeology, with emphasis on rock art, hunter-gatherer mobility, and prehistoric land use in the South-Central Andes. He integrates photogrammetry, terrestrial LiDAR, and GIS-based modeling into the study of archaeological landscapes and material culture, while developing machine learning approaches to predictive modeling. His work combines digital methodologies with traditional fieldwork to explore human settlement across diverse Andean and coastal environments. He has led and participated in national and international research initiatives contributing to broader discussions on virtual heritage, interdisciplinary archaeology, and the digital transformation of cultural heritage practice.
