bio_es: Zaray Guerrero es socia de la Sociedad Chilena de Arqueología y tiene experiencia de investigación en el estudio del arte rupestre pintado y grabado del norte de Chile. Su investigación se ha centrado en el análisis formal y compositivo del arte rupestre para clasificar los motivos documentados en las tierras altas de Arica, con especial énfasis en las representaciones pintadas asociadas a las primeras ocupaciones de la región por grupos cazadores-recolectores arcaicos. Su trabajo en una secuencia gráfica y cronológica integral para el área de estudio, coherente con el registro arqueológico, ha entregado un marco para análisis comparativos posteriores entre distintos sectores, revelando relaciones diacrónicas en la producción gráfica entre localidades de las tierras altas de Arica.
bio_en: Zaray Guerrero is a member of the Sociedad Chilena de Arqueología, with research experience in the study of painted and engraved rock art in northern Chile. Her research has focused on the formal and compositional analysis of rock art for the classification of motifs documented in the highlands of Arica, with particular emphasis on painted representations associated with the earliest occupations of the region by Archaic hunter-gatherer groups. Her work on developing a comprehensive graphic and chronological sequence for the study area, consistent with the archaeological record, has provided a framework for subsequent comparative analyses across different sectors, revealing diachronic relationships in graphic production among localities in the highlands of Arica.
