pasos:
- titulo_es: Marcamos las figuras
  titulo_en: We mark the figures
  texto_es: Fotografiamos las piezas y señalamos cada motivo con un vocabulario común.
  texto_en: We photograph each piece and label every motif with a shared vocabulary.
- titulo_es: La IA busca parecidos
  titulo_en: AI looks for similarities
  texto_es: Las imágenes que se parecen quedan cerca, aunque estén en soportes distintos.
  texto_en: Images that look alike end up close together, even across different media.
- titulo_es: Los arqueólogos interpretan
  titulo_en: Archaeologists interpret
  texto_es: Revisan, corrigen y explican qué significan esos parecidos. Cada revisión le enseña al modelo qué importa.
  texto_en: They review, correct and explain what those similarities mean. Each review teaches the model what matters.
