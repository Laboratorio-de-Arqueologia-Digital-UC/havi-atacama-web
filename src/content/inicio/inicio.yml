titulo_es: Leer las imágenes del desierto
titulo_en: Reading the images of the desert
bajada_es: Arqueología e inteligencia artificial para comparar los motivos de la cerámica, los geoglifos y el arte rupestre del desierto de Atacama, entre los años 1000 y 1400.
bajada_en: Archaeology and artificial intelligence to compare the motifs of ceramics, geoglyphs and rock art in the Atacama Desert, between AD 1000 and 1400.
descripcion_es: |
  Este proyecto reúne arqueología e inteligencia artificial para estudiar tradiciones visuales compartidas entre la cerámica, los geoglifos y el arte rupestre del desierto de Atacama, en Chile.

  El equipo construirá una base de conocimiento y un marco de análisis visual para comparar motivos entre soportes muy distintos. Con él generará nueva evidencia sobre redes de intercambio e interacción social prehispánicas, y hará avanzar métodos de IA interpretables, validados con datos reales y heterogéneos.
descripcion_en: |
  This project brings archaeology and AI together to study shared visual traditions across ceramics, geoglyphs, and rock art in Chile’s Atacama Desert.

  The team will build a knowledge base and visual analysis framework designed to compare motifs across these heterogeneous media. Through this framework, the team will generate new evidence on prehispanic exchange networks and social interaction patterns while advancing interpretable AI methods validated on heterogeneous, real-world data.
